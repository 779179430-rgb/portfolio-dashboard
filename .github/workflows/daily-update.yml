name: 每日行情更新

on:
  schedule:
    # 北京时间 9:00 和 20:30 自动运行
    - cron: '0 1 * * *'   # UTC 1:00 = 北京时间 9:00
    - cron: '30 12 * * *' # UTC 12:30 = 北京时间 20:30
  workflow_dispatch:      # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 更新行情数据
        run: bash update-data.sh

      - name: 提交更新
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@dashboard.local"
          git add index.html
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📊 自动更新行情数据 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
