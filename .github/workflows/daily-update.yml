name: 多时段行情监控 + 钉钉推送

on:
  schedule:
    # 北京时间 9:00 盘前早报
    - cron: '0 1 * * *'
    # 北京时间 11:30 上午收盘快报
    - cron: '30 3 * * *'
    # 北京时间 13:00 午间新闻扫描 + 下午展望
    - cron: '0 5 * * *'
    # 北京时间 15:30 收盘复盘
    - cron: '30 7 * * *'
    # 北京时间 20:30 晚间新闻 + 美股开盘前瞻
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: '报告类型'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - morning
          - snapshot
          - closing

jobs:
  # ========== 盘前早报 (9:00) ==========
  morning-report:
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 推送钉钉早报
        run: bash morning-report.sh

  # ========== 盘中快报 (11:30 / 13:00) ==========
  snapshot-report:
    if: github.event.schedule == '30 3 * * *' || github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 推送盘中快报
        run: bash snapshot-report.sh

  # ========== 收盘复盘 (15:30) ==========
  closing-report:
    if: github.event.schedule == '30 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 推送收盘复盘
        run: bash closing-report.sh

  # ========== 晚间扫描 (20:30) ==========
  evening-report:
    if: github.event.schedule == '30 12 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 推送晚间速递
        run: bash evening-report.sh

  # ========== 行情数据刷新 (跟随每次推送) ==========
  update-dashboard:
    runs-on: ubuntu-latest
    needs: [morning-report, snapshot-report, closing-report, evening-report]
    if: always() && (needs.morning-report.result == 'success' || needs.snapshot-report.result == 'success' || needs.closing-report.result == 'success' || needs.evening-report.result == 'success')
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 更新行情数据
        run: bash update-data.sh

      - name: 提交更新
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@dashboard.local"
          git add index.html
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📊 自动更新行情数据 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
